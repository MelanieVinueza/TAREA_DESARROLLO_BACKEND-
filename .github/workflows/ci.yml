name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    env:
      DB_NAME: bdproductos
      DB_USER: productos_app
      DB_PASSWORD: REEMPLAZAR_LOCALMENTE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check dependencies and known vulnerabilities
        run: |
          npm ls --depth=0
          npm audit --audit-level=moderate
      - name: Check module cycles
        run: npm run check:modules
      - run: npm test
